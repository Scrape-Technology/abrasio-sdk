[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abrasio"
version = "0.4.1"
description = "Stealth web scraping SDK with optional cloud browser support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Scrape Technology", email = "joao.sobhie@scrapetechnology.com" }
]
keywords = [
    "web-scraping",
    "stealth-browser",
    "scraping-browser",
    "browser-automation",
    "managed-browser",
    "headless-browser",
    "playwright",
    "patchright",
    "cdp",
    "tls-fingerprint",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "patchright>=1.58.0",
    "httpx>=0.26.0",
    "curl-cffi>=0.15.0"
]

[project.optional-dependencies]
fingerprint = [
    "browserforge>=1.2.4",
]
tls = [
    "curl-cffi>=0.15.0",
]
cert = [
    "cryptography>=41.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
all = [
    "browserforge>=1.2.4",
    "curl-cffi>=0.15.0",
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://scrapetechnology.com/abrasio"
Documentation = "https://scrapetechnology.com/abrasio/docs"
Repository = "https://github.com/Scrape-Technology/abrasio-sdk"
Issues = "https://github.com/Scrape-Technology/abrasio-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["abrasio"]

# Explicit allow-list: a local `python -m build` must never pick up untracked
# scripts, screenshots or tool state lying in the working tree.
[tool.hatch.build.targets.sdist]
include = ["abrasio", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
